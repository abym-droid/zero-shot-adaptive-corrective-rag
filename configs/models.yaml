# Candidate open-weight models + retrievers for the system.
# All locally deployable, training-free, reduced precision.
# MLX 4-bit ids are the MacBook-native path; HF ids are the Colab/CUDA
# equivalents (bf16 or bitsandbytes 4-bit).
#
# status: verified  = loads locally and emits clean routing JSON
#         untested  = plausible candidate, not yet run
#         cuda-only = MLX conversion unusable; run on Colab via transformers

generators:
  # --- core (locked) ---
  primary:                                                 # router structured-JSON workhorse
    name: Qwen2.5-7B-Instruct
    mlx_4bit: mlx-community/Qwen2.5-7B-Instruct-4bit       # ~4.3 GB
    hf: Qwen/Qwen2.5-7B-Instruct
    status: verified
  alt_mistral:                                             # 2nd router-ablation model (different family)
    name: Mistral-7B-Instruct-v0.3
    mlx_4bit: mlx-community/Mistral-7B-Instruct-v0.3-4bit
    hf: mistralai/Mistral-7B-Instruct-v0.3
    status: untested

  # --- comparator (local open-weight upper bound) ---
  comparator_large:
    name: Qwen3-8B
    mlx_4bit: mlx-community/Qwen3-8B-4bit
    status: untested

  # --- Gemma 4 family: Colab/CUDA only ---
  # The mlx-community 4-bit conversions do not load on the current MLX stack
  # (gemma4's per-layer QK-norm attention isn't modelled yet), so these run on
  # Colab through transformers instead. E4B (~4B effective params) is the
  # interesting third-family candidate for the router ablation.
  gemma4_e4b:
    name: Gemma-4-E4B-it
    hf: google/gemma-4-e4b-it                              # 131k ctx
    status: "cuda-only: MLX gemma4 conversion unsupported"
  gemma4_12b:
    name: Gemma-4-12B-it
    hf: google/gemma-4-12b-it                              # instruct; the plain
    status: "cuda-only: MLX gemma4 conversion unsupported" #  gemma-4-12b is BASE
  gemma4_e2b:
    name: Gemma-4-E2B-it
    hf: google/gemma-4-e2b-it
    status: "cuda-only: MLX gemma4 conversion unsupported"
  # MLX-workable Gemma fallback if a local Gemma arm is wanted (older arch,
  # supported by mlx-lm): mlx-community/gemma-2-9b-it-4bit (untested).

# The router ablation needs at least two router models and two prompt
# variants; spanning architecture families (Qwen / Mistral / Gemma) plus a
# size sweep makes the generality claim harder to attack than a two-model study.
router_ablation_models:
  - mlx-community/Qwen2.5-7B-Instruct-4bit          # verified, local
  - mlx-community/Mistral-7B-Instruct-v0.3-4bit     # untested, local
  # Colab/CUDA arm (HF ids, transformers backend):
  # - google/gemma-4-e4b-it
  # - google/gemma-4-12b-it

retrievers:
  dense:
    embedder: sentence-transformers/all-MiniLM-L6-v2     # fast dense baseline
    embedder_strong: BAAI/bge-base-en-v1.5               # stronger dense option
    index: faiss                                          # on-disk IndexFlatIP / IVF
  sparse:
    method: bm25                                          # rank-bm25 baseline
  late_interaction:
    model: colbert-ir/colbertv2.0                         # router's high-tier option
    backend: ragatouille                                  # optional dep; Colab for indexing

# Proprietary APIs - comparator / tooling ONLY, never in the deliverable pipeline.
comparators_tooling:
  skyline: null                       # optional upper-bound comparator, decided at eval time
  llm_judge:                          # RAGAS faithfulness judge (scripts/score_faithfulness.py)
    openai: [gpt-5.6-luna, gpt-5.6-terra]
    anthropic: [claude-sonnet-5, claude-opus-5]
    local: gemma4 MoE via Ollama      # untested; probe with --limit before a full run
